<script src="./script.js"></script>

<h2 id="titre">Counter</h2>
<!-- ETAPE 1 : Ci dessous on affiche notre compteur, initialement à 0 -->
 <!-- RETENEZ BIEN QUE L'ID DU COMPTEUR EST EGAL A "count" -->
<p id="count" style="font-size:40px;">0</p>

<!-- ETAPE 3 : On clique sur le bouton +
 à chaque clique du bouton +, la fonction js increaseCount() s'execute -->
<button onclick="increaseCount()">+</button>
<button onclick="decreaseCount()">-</button>
<button onclick="resetCount()">Reset</button>
<button onclick="saveCount()">Save</button>
<button onclick="loadCount()">Load</button>
